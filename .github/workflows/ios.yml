name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add and sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build IPA
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          echo "Key ID length: ${#API_KEY_ID}"
          echo "Issuer ID length: ${#API_ISSUER_ID}"
          cd ios/App
          mkdir -p ~/private_keys
          printf '%s\n' "$API_PRIVATE_KEY" > ~/private_keys/AuthKey_$API_KEY_ID.p8
          ls -la ~/private_keys/
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS -archivePath $RUNNER_TEMP/App.xcarchive DEVELOPMENT_TEAM=78PU393GBQ -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_$API_KEY_ID.p8 -authenticationKeyID $API_KEY_ID -authenticationKeyIssuerID $API_ISSUER_ID archive
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath $RUNNER_TEMP/export

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

